  </head><body class="min-h-full bg-surface text-on-surface font-body antialiased flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-3 flex items-center justify-between"><div class="flex items-center gap-1 min-w-[44px]"><button onclick="history.back()" aria-label="Quay lại" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface active:bg-surface-container transition-colors"><span class="text-2xl font-light leading-none -mt-0.5 select-none">‹</span></button><h1 class="text-base font-headline font-bold text-on-surface tracking-tight ml-1">Tạo Kèo</h1></div><div class="flex items-center gap-2"><button aria-label="Hỗ trợ" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant active:bg-surface-container"><span class="material-symbols-outlined text-[22px]">help_outline</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 w-full bg-surface pt-16"><div class="flex flex-col w-full pb-24 text-on-surface">

      </div>
      <button onclick="history.back()" class="w-9 h-9 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors" aria-label="Đóng">
        <span class="text-xl leading-none">×</span>
      </button>
    </div>

          <span class="text-sm font-medium text-on-surface">Gần tôi</span>

        <label class="relative inline-flex items-center cursor-pointer">

    </div>

        </div>

          <div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center shrink-0 text-outline">
            <span class="material-symbols-outlined text-[24px]">stadium</span>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">

            </div>
            <p class="text-xs text-on-surface-variant truncate mt-0.5">Phường 13</p>
          </div>
        </div>
        <div class="pl-3">
          <input type="checkbox" class="w-5 h-5 accent-primary rounded cursor-pointer pointer-events-none">
        </div>
      </div>

      <!-- Venue Item 3: Checked -->
      <div onclick="this.querySelector('input').click()" class="flex items-center justify-between p-3 rounded-lg bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-12 h-12 rounded-lg bg-primary-container/40 flex items-center justify-center shrink-0 text-primary">
            <span class="material-symbols-outlined text-[24px]">stadium</span>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-semibold text-on-surface truncate">Sân Thành Long</h3>
              <span class="px-2 py-0.5 text-[10px] font-medium bg-primary-container text-on-primary-container rounded-full">Sân 11</span>
            </div>
            <p class="text-xs text-on-surface-variant truncate mt-0.5">Phường Ba Đình</p>
          </div>
        </div>
        <div class="pl-3">
          <input type="checkbox" checked class="w-5 h-5 accent-primary rounded cursor-pointer pointer-events-none">
        </div>
      </div>

      <!-- Venue Item 4: Unchecked -->
      <div onclick="this.querySelector('input').click()" class="flex items-center justify-between p-3 rounded-lg bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center shrink-0 text-outline">
            <span class="material-symbols-outlined text-[24px]">stadium</span>
          </div>
          <div class="min-w-0">
