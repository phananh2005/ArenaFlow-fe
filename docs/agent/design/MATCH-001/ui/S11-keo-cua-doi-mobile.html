<script>
  // Simple interaction for creating a match toast or alert
  function openCreateModal() {
    // Delightful micro-interaction placeholder
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-xl text-xs font-medium shadow-xl z-50 flex items-center gap-2 animate-bounce';

    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }
