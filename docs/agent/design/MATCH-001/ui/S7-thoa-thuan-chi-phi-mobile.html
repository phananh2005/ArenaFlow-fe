  </head><body class="bg-background text-on-surface font-body antialiased flex flex-col min-h-screen"><header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-4 flex items-center justify-between"><div class="flex items-center gap-2"><a class="flex items-center gap-1.5 focus:outline-none" data-path="recruitment-dashboard" href="#"><div class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center text-on-primary font-bold text-sm tracking-tighter">AF</div><span class="font-headline font-bold text-lg text-primary tracking-tight">ArenaFlow</span></a></div><div class="flex items-center gap-1.5"><button aria-label="Menu" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors focus:outline-none" type="button"><span class="material-symbols-outlined text-[24px]">menu</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-background"><div class="flex flex-col w-full relative min-h-screen bg-inverse-surface/40 backdrop-blur-sm">
<!-- Spacer to push bottom sheet down, simulating a modal overlay -->
<div class="flex-1"></div>
<!-- Bottom Sheet Modal -->
<div class="w-full bg-surface rounded-t-2xl shadow-2xl flex flex-col max-h-[795px] overflow-hidden animate-in fade-in slide-in-from-bottom duration-300">
<!-- Modal Header -->
<div class="px-5 pt-5 pb-4 flex items-center justify-between bg-surface">
<div>
<span class="text-xs font-semibold tracking-wider text-primary uppercase">MATCH-001 S7</span>
<h2 class="text-lg font-bold text-on-surface">Thoả thuận chi phí</h2>
</div>
<button aria-label="Đóng" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors focus:outline-none">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Modal Content (Scrollable) -->
<div class="px-5 pb-6 overflow-y-auto space-y-5 flex-1">
<!-- Loại chi phí (Choice Chips) -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Loại chi phí</label>
<div class="flex flex-wrap gap-2">
<button class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors" type="button">Không có</button>
<button class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors" type="button">Tiền sân</button>
<button class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors" type="button">Tiền nước</button>
<button class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-primary text-on-primary shadow-sm transition-colors" type="button">Cả hai</button>
</div>
</div>
<!-- Cost Inputs -->
<div class="grid grid-cols-2 gap-3">
<div class="space-y-1.5">
<label class="block text-xs font-medium text-on-surface-variant">Tiền sân (VND)</label>
<div class="bg-surface-container-low rounded-lg px-3 py-2.5 flex items-center shadow-sm">
<input class="w-full bg-transparent text-on-surface font-semibold text-sm focus:outline-none" type="text" value="600.000"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-medium text-on-surface-variant">Tiền nước (VND)</label>
<div class="bg-surface-container-low rounded-lg px-3 py-2.5 flex items-center shadow-sm">
<input class="w-full bg-transparent text-on-surface font-semibold text-sm focus:outline-none" type="text" value="100.000"/>
</div>
</div>
</div>
<!-- Cách chia (Radio List) -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Cách chia</label>
<div class="space-y-2">
<!-- Option 1: Selected -->
<label class="flex items-center justify-between p-3 rounded-lg bg-surface-container-low shadow-sm cursor-pointer hover:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-on-primary"></span>
</div>
<span class="text-sm font-medium text-on-surface">Chia đôi 50-50</span>
</div>
<span class="text-xs text-primary font-medium">Khuyên dùng</span>
</label>
<!-- Option 2 -->
<label class="flex items-center gap-3 p-3 rounded-lg bg-surface-container-low shadow-sm cursor-pointer hover:bg-surface-container transition-colors">
<div class="w-5 h-5 rounded-full bg-surface-variant flex items-center justify-center"></div>
<span class="text-sm font-medium text-on-surface">70-30, đội chủ nhà bao 70%</span>
</label>
<!-- Option 3 -->
<label class="flex items-center gap-3 p-3 rounded-lg bg-surface-container-low shadow-sm cursor-pointer hover:bg-surface-container transition-colors">
<div class="w-5 h-5 rounded-full bg-surface-variant flex items-center justify-center"></div>
<span class="text-sm font-medium text-on-surface">70-30, đội thua bao 70%</span>
</label>
<!-- Option 4 -->
<label class="flex items-center gap-3 p-3 rounded-lg bg-surface-container-low shadow-sm cursor-pointer hover:bg-surface-container transition-colors">
<div class="w-5 h-5 rounded-full bg-surface-variant flex items-center justify-center"></div>
<span class="text-sm font-medium text-on-surface">Đội thua trả toàn bộ tiền nước</span>
</label>
</div>
</div>
<!-- Khoản khác -->
<div class="space-y-3">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Khoản khác (2/10)</label>
<span class="text-xs text-on-surface-variant">Tối đa 10</span>
</div>
<!-- Row 1: Tiền trọng tài -->
<div class="flex items-center gap-2 p-2.5 rounded-lg bg-surface-container-low shadow-sm">
<div class="flex-1 min-w-0">
<p class="text-xs text-on-surface-variant truncate">Tiền trọng tài</p>
<p class="text-sm font-semibold text-on-surface">200.000 đ</p>
</div>
<button aria-label="Xoá khoản" class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-error hover:bg-error-container/10 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">delete</span>
</button>
</div>
<!-- Row 2: Phí áo đấu with Error State -->
<div class="flex flex-col gap-1 p-2.5 rounded-lg bg-surface-container-low shadow-sm">
<div class="flex items-center gap-2">
<div class="flex-1 min-w-0">
<p class="text-xs text-on-surface-variant truncate">Phí áo đấu</p>
<div class="mt-1 flex items-center bg-surface rounded px-2 py-1.5 shadow-sm" style="box-shadow: 0 0 0 1px #a73b21;">
<input class="w-full bg-transparent text-on-surface font-semibold text-sm focus:outline-none" type="text" value="0"/>
<span class="text-xs text-on-surface-variant ml-1">VND</span>
</div>
</div>
<button aria-label="Xoá khoản" class="w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-error hover:bg-error-container/10 transition-colors self-start mt-4" type="button">
<span class="material-symbols-outlined text-[18px]">delete</span>
</button>
</div>
<p class="text-xs font-medium text-error mt-0.5">Số tiền phải lớn hơn 0</p>
</div>
<!-- Add item button -->
<button class="w-full py-2.5 rounded-lg text-sm font-semibold text-primary bg-surface-container hover:bg-surface-container-high transition-colors flex items-center justify-center gap-1.5 shadow-sm" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
          Thêm khoản phí
        </button>
</div>
<!-- Disclaimer notice -->
<div class="p-3 rounded-lg bg-surface-container-low flex items-start gap-2.5">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant mt-0.5">info</span>
<p class="text-xs text-on-surface-variant leading-relaxed">ArenaFlow không thu hay giữ tiền; hai đội tự thanh toán.</p>
</div>
</div>
<!-- Footer Actions -->
<div class="p-5 bg-surface border-t border-surface-container flex flex-col gap-3">
<div class="flex items-center justify-between">
<button class="text-xs font-semibold text-error hover:underline flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]">delete_forever</span>
          Xoá thoả thuận
        </button>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="w-full py-3 rounded-lg text-sm font-semibold text-on-surface bg-surface-container hover:bg-surface-container-high transition-colors shadow-sm" type="button">
          Huỷ
        </button>
<button class="w-full py-3 rounded-lg text-sm font-semibold text-on-primary bg-primary hover:bg-primary-dim transition-colors shadow-md" type="button">
          Lưu thoả thuận
        </button>
</div>
</div>
</div>
</div></main></body></html>
