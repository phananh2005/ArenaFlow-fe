<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaFlow — S4 Sửa hồ sơ</title>
  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#3d6943',
              dark: '#2d4e32',
              light: '#eaf3ec',
              surface: '#f4f8f5'
            },
            danger: {
              DEFAULT: '#dc2626',
              light: '#fef2f2',
              border: '#fca5a5'
            }
          },
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          borderRadius: {
            'custom': '8px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    /* Hide scrollbars cleanly */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-slate-100">

  <!-- Mobile Container: 390px fixed width -->
  <main class="w-full max-w-[390px] min-h-[844px] bg-white shadow-2xl flex flex-col relative mx-auto overflow-hidden">

    <!-- Header thu gọn nền trắng: nút "←" bên trái, tiêu đề "Sửa hồ sơ" ở giữa -->
    <header class="sticky top-0 z-20 bg-white border-b border-slate-100 px-4 h-14 flex items-center justify-between">
      <button type="button" aria-label="Quay lại" class="w-10 h-10 flex items-center justify-center -ml-2 text-slate-700 hover:text-slate-900 active:scale-95 transition-transform rounded-custom">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <h1 class="text-base font-semibold text-slate-900 tracking-tight text-center flex-1 pr-8">
        Sửa hồ sơ
      </h1>
    </header>

    <!-- Scrollable Content Form -->
    <div class="flex-1 overflow-y-auto px-4 pt-6 pb-28 no-scrollbar bg-white">
      <form class="space-y-5" onsubmit="event.preventDefault();">

        <!-- Avatar tròn lớn căn giữa (ảnh người) + nút viền nhỏ "Đổi ảnh" bên dưới -->
        <div class="flex flex-col items-center justify-center pb-2">
          <div class="relative w-24 h-24 rounded-full overflow-hidden ring-4 ring-slate-100 shadow-sm mb-3">
            <img 
              src="https://lh3.googleusercontent.com/aida/ALJJyrDWZvlB2vLrZd5tXFPULJEV05yE6aEUIMDvhsxIOJXfi3xzZIoWJAgsbc39xT4I1UzgZgsD6jpMQ63yt9pmIC4q1Xhq5QdrBwpMnCpHWlIQpa4A_C9SrVHkvxFtZSiqcQ-Uu-iVuuLwSmry8weQrPa7nc8OYwNWciqDpjhP_TZe0j97mNERVosSHE5Q2nzF7A133E72eZ3U7omDl7gJfmsF0PmmvpTZw5a1m5rZ9UHZLwx4Cf8_rOU-YS4" 
              alt="Ảnh đại diện Nguyễn Văn A" 
              class="w-full h-full object-cover object-center"
            />
          </div>
          <button 
            type="button" 
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-custom hover:bg-slate-50 active:scale-95 transition-all shadow-xs"
          >
            <i data-lucide="camera" class="w-3.5 h-3.5 text-slate-500"></i>
            <span>Đổi ảnh</span>
          </button>
        </div>

        <!-- Tên hiển thị * : ô nhập "Nguyễn Văn A", bộ đếm "12/100" -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-700">
            Tên hiển thị <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <input 
              type="text" 
              value="Nguyễn Văn A" 
              class="w-full px-3 py-2.5 text-sm text-slate-900 bg-white border border-slate-300 rounded-custom focus:outline-none focus:ring-2 focus:ring-[#3d6943] focus:border-transparent transition-all"
            />
          </div>
          <div class="text-right">
            <span class="text-[11px] text-slate-400 font-medium tracking-tight">12/100</span>
          </div>
        </div>

        <!-- Tiểu sử : textarea "Đá sân 7 tối thứ 4, thích đá cánh.", bộ đếm "34/1000" -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-700">
            Tiểu sử
          </label>
          <div class="relative">
            <textarea 
              rows="3" 
              class="w-full px-3 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-custom focus:outline-none focus:ring-2 focus:ring-[#3d6943] focus:border-transparent transition-all resize-none leading-relaxed"
            >Đá sân 7 tối thứ 4, thích đá cánh.</textarea>
          </div>
          <div class="text-right">
            <span class="text-[11px] text-slate-400 font-medium tracking-tight">34/1000</span>
          </div>
        </div>

        <!-- Vị trí chơi ưa thích : 4 chip chọn một: "Thủ môn", "Hậu vệ", "Tiền vệ" (đang chọn), "Tiền đạo" -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-700">
            Vị trí chơi ưa thích
          </label>
          <div class="flex flex-wrap gap-2">
            <!-- Chip: Thủ môn (unselected) -->
            <button 
              type="button" 
              class="px-3.5 py-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-200 rounded-custom hover:border-slate-300 transition-colors"
            >
              Thủ môn
            </button>

            <!-- Chip: Hậu vệ (unselected) -->
            <button 
              type="button" 
              class="px-3.5 py-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-200 rounded-custom hover:border-slate-300 transition-colors"
            >
              Hậu vệ
            </button>

            <!-- Chip: Tiền vệ (đang chọn - bg-[#3d6943] text-white) -->
            <button 
              type="button" 
              class="px-3.5 py-1.5 text-xs font-semibold text-white bg-[#3d6943] border border-[#3d6943] rounded-custom shadow-xs"
            >
              Tiền vệ
            </button>

            <!-- Chip: Tiền đạo (unselected) -->
            <button 
              type="button" 
              class="px-3.5 py-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-200 rounded-custom hover:border-slate-300 transition-colors"
            >
              Tiền đạo
            </button>
          </div>
        </div>

        <!-- Ngày sinh : ô chọn ngày "15/05/2020", viền màu error, chữ lỗi "Bạn phải đủ 13 tuổi" -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-700">
            Ngày sinh
          </label>
          <div class="relative">
            <input 
              type="text" 
              value="15/05/2020" 
              class="w-full px-3 py-2.5 pr-10 text-sm text-slate-900 bg-white border border-red-500 rounded-custom focus:outline-none focus:ring-1 focus:ring-red-500"
            />
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-red-500">
              <i data-lucide="alert-circle" class="w-4 h-4"></i>
            </div>
          </div>
          <p class="text-[11px] text-red-600 font-medium flex items-center gap-1 mt-1">
            <span>Bạn phải đủ 13 tuổi</span>
          </p>
        </div>

        <!-- Giới tính : select "Nam" -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-700">
            Giới tính
          </label>
          <div class="relative">
            <select class="w-full px-3 py-2.5 pr-10 text-sm text-slate-900 bg-white border border-slate-300 rounded-custom appearance-none focus:outline-none focus:ring-2 focus:ring-[#3d6943] focus:border-transparent transition-all">
              <option value="Nam" selected>Nam</option>
              <option value="Nữ">Nữ</option>
              <option value="Khác">Khác</option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </div>
          </div>
        </div>

        <!-- Khu vực (phường/xã) : ô select có icon tìm, placeholder "Chọn phường/xã" -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-700">
            Khu vực (phường/xã)
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="search" class="w-4 h-4"></i>
            </div>
            <select class="w-full pl-9 pr-10 py-2.5 text-sm text-slate-500 bg-white border border-slate-300 rounded-custom appearance-none focus:outline-none focus:ring-2 focus:ring-[#3d6943] focus:border-transparent transition-all">
              <option value="" disabled selected>Chọn phường/xã</option>
              <option value="1" class="text-slate-800">Phường Dịch Vọng Hậu, Cầu Giấy</option>
              <option value="2" class="text-slate-800">Phường Mễ Trì, Nam Từ Liêm</option>
              <option value="3" class="text-slate-800">Phường Nhân Chính, Thanh Xuân</option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </div>
          </div>
        </div>

      </form>
    </div>

    <!-- Thanh nút dính đáy màn hình (sticky, nền trắng, viền trên): nút viền "Huỷ" và nút chính "Lưu thay đổi" chia đôi chiều ngang -->
    <footer class="absolute bottom-0 inset-x-0 bg-white border-t border-slate-200 px-4 py-3 z-30 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
      <div class="grid grid-cols-2 gap-3">
        <button 
          type="button" 
          class="w-full py-2.5 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-custom hover:bg-slate-50 active:scale-[0.98] transition-all text-center"
        >
          Huỷ
        </button>
        <button 
          type="button" 
          class="w-full py-2.5 text-sm font-semibold text-white bg-[#3d6943] hover:bg-[#2d4e32] active:scale-[0.98] transition-all rounded-custom shadow-xs text-center"
        >
          Lưu thay đổi
        </button>
      </div>
    </footer>

  </main>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
