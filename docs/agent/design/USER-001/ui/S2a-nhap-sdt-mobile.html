<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaFlow — S2a Đăng nhập bằng số điện thoại (Mobile 390px)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            brandDarkGreen: '#14532D',
            brandBtn: '#3d6943',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
  </style>
</head>
<body class="py-8">

  <!-- Mobile Frame 390px -->
  <div class="w-[390px] min-h-[844px] bg-white shadow-xl overflow-hidden flex flex-col relative" style="border-radius: 8px;">

    <!-- Dải đầu trang thấp nền xanh lá đậm (#14532D) có họa tiết sân bóng mờ, chỉ có logo ArenaFlow -->
    <header class="relative bg-[#14532D] h-28 px-6 flex items-center justify-start overflow-hidden select-none">
      <!-- Pitch line markings overlay -->
      <svg class="absolute inset-0 w-full h-full pointer-events-none stroke-white/15 fill-none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 390 112">
        <!-- Outer boundary & half-way line -->
        <line x1="20" y1="10" x2="370" y2="10" stroke-width="1.2" />
        <line x1="20" y1="10" x2="20" y2="112" stroke-width="1.2" />
        <line x1="370" y1="10" x2="370" y2="112" stroke-width="1.2" />
        <line x1="195" y1="10" x2="195" y2="112" stroke-width="1.2" />
        <!-- Center circle -->
        <circle cx="195" cy="112" r="60" stroke-width="1.2" />
        <circle cx="195" cy="112" r="2.5" class="fill-white/20" />
        <!-- Corner arc -->
        <path d="M 20 30 A 20 20 0 0 0 40 10" stroke-width="1.2" />
        <path d="M 350 10 A 20 20 0 0 0 370 30" stroke-width="1.2" />
      </svg>

      <!-- Logo ArenaFlow: icon quả bóng trong ô vuông bo góc -->
      <div class="relative z-10 flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-[8px] border border-white/30 bg-white/10 flex items-center justify-center text-white backdrop-blur-sm shadow-sm">
          <!-- Soccer ball icon -->
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 3.09c2.51.35 4.63 1.74 5.91 3.69l-3.3 1.9-2.61-1.5V5.09zM8.39 9.18l-3.3-1.9A8.005 8.005 0 0 1 11 5.09v4.09l-2.61 1.5zm-4.3 4.29c-.06-.48-.09-.97-.09-1.47 0-.71.07-1.4.21-2.07l3.8 2.19v2.98L4.09 13.47zm2.5 4.67l3.41-1.97v-3.34l3-1.73 3 1.73v3.34l3.41 1.97A7.94 7.94 0 0 1 12 20a7.94 7.94 0 0 1-5.41-1.86zm11.32-2.7l-3.91-2.26v-2.98l3.8-2.19c.14.67.21 1.36.21 2.07 0 .5-.03.99-.1 1.36z"/>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">ArenaFlow</span>
      </div>
    </header>

    <!-- Phần dưới nền trắng -->
    <main class="flex-1 bg-white px-6 pt-7 pb-8 flex flex-col">
      <!-- Link ← Quay lại -->
      <a href="#" class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-gray-900 transition-colors mb-6 group w-fit">
        <span class="mr-1.5 transition-transform group-hover:-translate-x-0.5">←</span>
        <span>Quay lại</span>
      </a>

      <!-- Tiêu đề & Dòng phụ -->
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight mb-2">
        Nhập số điện thoại
      </h1>
      <p class="text-sm text-gray-500 leading-relaxed mb-7">
        Chúng tôi sẽ gửi mã xác thực gồm 6 chữ số tới số này
      </p>

      <!-- Form nhập số điện thoại -->
      <div class="flex flex-col mb-6">
        <label for="phone" class="text-xs font-semibold text-gray-700 mb-1.5">
          Số điện thoại
        </label>
        
        <!-- Input viền màu error, bo góc 8px, giá trị 098765432 -->
        <div class="relative">
          <input
            type="tel"
            id="phone"
            name="phone"
            value="098765432"
            class="w-full px-3.5 py-3 text-base text-gray-900 bg-white border border-red-500 rounded-[8px] focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500"
          />
        </div>

        <!-- Chữ lỗi bên dưới kèm icon cảnh báo -->
        <div class="flex items-center gap-1.5 mt-2 text-xs font-medium text-red-600">
          <svg class="w-3.5 h-3.5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-width="2"></circle>
            <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"></line>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"></line>
          </svg>
          <span>Số điện thoại phải gồm 10 chữ số và bắt đầu bằng 0</span>
        </div>
      </div>

      <!-- Nút chính full-width màu #3d6943 -->
      <button
        type="button"
        class="w-full py-3.5 px-4 bg-[#3d6943] hover:bg-[#345b3a] active:bg-[#2c4e31] text-white font-medium text-sm rounded-[8px] transition duration-150 ease-in-out shadow-sm flex items-center justify-center cursor-pointer"
      >
        Gửi mã xác thực
      </button>
    </main>

  </div>

</body>
</html>
