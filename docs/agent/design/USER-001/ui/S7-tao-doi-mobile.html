<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>ArenaFlow — S7 Tạo đội (mobile web 390px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#3d6943',
              dark: '#2e5134',
              light: '#f2f7f3',
            },
            error: {
              DEFAULT: '#dc2626',
              light: '#fef2f2',
            }
          },
          borderRadius: {
            'custom': '8px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 24px 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 390px;
      min-height: 844px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      overflow: hidden;
    }
    /* Custom scrollbar styling if needed */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <!-- Header thu gọn nền trắng -->
    <header class="sticky top-0 z-30 bg-white border-b border-gray-100 px-4 h-14 flex items-center justify-between">
      <button type="button" aria-label="Quay lại" class="w-10 h-10 -ml-2 flex items-center justify-center text-gray-700 hover:text-gray-900 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <h1 class="text-base font-bold text-gray-900 text-center flex-1 pr-8">Tạo đội mới</h1>
    </header>

    <!-- Nội dung Form xếp dọc -->
    <main class="flex-1 px-5 pt-6 pb-28 flex flex-col gap-6 bg-white overflow-y-auto">
      
      <!-- Mục: Logo đội -->
      <div class="flex flex-col items-center">
        <label class="w-full text-sm font-semibold text-gray-900 mb-3 text-left">Logo đội</label>
        <div class="w-20 h-20 rounded-full bg-gray-50 border-2 border-dashed border-gray-200 flex items-center justify-center text-gray-400 mb-3">
          <!-- Icon khiên -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-[#3d6943]/60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <button type="button" class="px-3.5 py-1.5 border border-gray-300 rounded-[8px] text-xs font-medium text-gray-700 hover:bg-gray-50 transition-colors">
          Chọn ảnh
        </button>
      </div>

      <!-- Mục: Tên đội * -->
      <div class="flex flex-col">
        <label class="text-sm font-semibold text-gray-900 mb-1.5">
          Tên đội <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input 
            type="text" 
            placeholder="" 
            value="" 
            class="w-full h-11 px-3.5 rounded-[8px] border border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 text-sm text-gray-900"
          />
        </div>
        <div class="flex items-center justify-between mt-1 text-xs">
          <span class="text-red-500 font-medium">Tên đội không được để trống</span>
          <span class="text-gray-400">0/100</span>
        </div>
      </div>

      <!-- Mục: Mô tả -->
      <div class="flex flex-col">
        <label class="text-sm font-semibold text-gray-900 mb-1.5">Mô tả</label>
        <div class="relative">
          <textarea 
            rows="3" 
            class="w-full p-3.5 rounded-[8px] border border-gray-300 focus:outline-none focus:border-[#3d6943] focus:ring-1 focus:ring-[#3d6943] text-sm text-gray-800 resize-none leading-relaxed"
          >Đá giao lưu tối thứ 4 hằng tuần.</textarea>
        </div>
        <div class="flex justify-end mt-1 text-xs text-gray-400">
          <span>32/1000</span>
        </div>
      </div>

      <!-- Mục: Trình độ đội -->
      <div class="flex flex-col">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-1.5">
            <span class="text-sm font-semibold text-gray-900">Trình độ đội</span>
            <span class="text-xs text-gray-400">(Chọn tối đa 3 nhãn)</span>
          </div>
          <span class="text-xs font-medium text-[#3d6943] bg-[#3d6943]/10 px-2 py-0.5 rounded-[8px]">Đã chọn 3/3</span>
        </div>

        <!-- 9 Chips -->
        <div class="flex flex-wrap gap-2 mt-2">
          <!-- 1. Chill (chưa chọn - mờ) -->
          <button type="button" class="px-3.5 py-1.5 rounded-[8px] text-xs font-medium bg-gray-50 border border-gray-200 text-gray-400 opacity-60">
            Chill
          </button>

          <!-- 2. Nhiệt tình (đã chọn) -->
          <button type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-[8px] text-xs font-medium bg-[#3d6943] text-white shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            <span>Nhiệt tình</span>
          </button>

          <!-- 3. Máu lửa (chưa chọn - mờ) -->
          <button type="button" class="px-3.5 py-1.5 rounded-[8px] text-xs font-medium bg-gray-50 border border-gray-200 text-gray-400 opacity-60">
            Máu lửa
          </button>

          <!-- 4. Vui chơi (chưa chọn - mờ) -->
          <button type="button" class="px-3.5 py-1.5 rounded-[8px] text-xs font-medium bg-gray-50 border border-gray-200 text-gray-400 opacity-60">
            Vui chơi
          </button>

          <!-- 5. Rèn luyện (đã chọn) -->
          <button type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-[8px] text-xs font-medium bg-[#3d6943] text-white shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            <span>Rèn luyện</span>
          </button>

          <!-- 6. Thi đấu (chưa chọn - mờ) -->
          <button type="button" class="px-3.5 py-1.5 rounded-[8px] text-xs font-medium bg-gray-50 border border-gray-200 text-gray-400 opacity-60">
            Thi đấu
          </button>

          <!-- 7. Mới bắt đầu (chưa chọn - mờ) -->
          <button type="button" class="px-3.5 py-1.5 rounded-[8px] text-xs font-medium bg-gray-50 border border-gray-200 text-gray-400 opacity-60">
            Mới bắt đầu
          </button>

          <!-- 8. Đã có kinh nghiệm (đã chọn) -->
          <button type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-[8px] text-xs font-medium bg-[#3d6943] text-white shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            <span>Đã có kinh nghiệm</span>
          </button>

          <!-- 9. Lão làng (chưa chọn - mờ) -->
          <button type="button" class="px-3.5 py-1.5 rounded-[8px] text-xs font-medium bg-gray-50 border border-gray-200 text-gray-400 opacity-60">
            Lão làng
          </button>
        </div>
      </div>

    </main>

    <!-- Thanh nút dính đáy (sticky, nền trắng, viền trên) -->
    <footer class="sticky bottom-0 z-30 bg-white border-t border-gray-200 px-4 py-3.5 flex items-center gap-3 w-full">
      <button type="button" class="flex-1 h-11 border border-gray-300 rounded-[8px] font-semibold text-sm text-gray-700 bg-white hover:bg-gray-50 active:scale-[0.98] transition-all flex items-center justify-center">
        Huỷ
      </button>
      <button type="button" class="flex-1 h-11 bg-[#3d6943] hover:bg-[#2e5134] rounded-[8px] font-semibold text-sm text-white shadow-sm active:scale-[0.98] transition-all flex items-center justify-center">
        Tạo đội
      </button>
    </footer>

  </div>

</body>
</html>
