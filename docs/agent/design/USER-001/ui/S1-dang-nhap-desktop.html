<body class="h-full bg-surface-container-lowest text-on-surface font-body antialiased overflow-hidden">
<div class="h-screen w-full flex flex-col md:flex-row">
<!-- Left Column: Rich Dark Athletic Green Column with Pitch Lines Overlay -->
<div class="relative w-full md:w-1/2 bg-[#14532D] text-white flex flex-col justify-between p-10 lg:p-16 overflow-hidden select-none">
<!-- Subtle Tactical Pitch Graphic Background -->
<div class="absolute inset-0 pointer-events-none opacity-[0.07] flex items-center justify-center">
<svg class="w-[140%] h-[140%] stroke-white stroke-[2] fill-none" viewbox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<!-- Pitch Outer Boundary -->
<rect height="500" rx="4" width="700" x="50" y="50"></rect>
<!-- Halfway Line -->
<line x1="400" x2="400" y1="50" y2="550"></line>
<!-- Center Circle & Spot -->
<circle cx="400" cy="300" r="75"></circle>
<circle cx="400" cy="300" fill="white" r="4"></circle>
<!-- Left Penalty Area & Goal Area -->
<rect height="280" width="130" x="50" y="160"></rect>
<rect height="150" width="45" x="50" y="225"></rect>
<path d="M 180 255 A 75 75 0 0 1 180 345"></path>
<!-- Right Penalty Area & Goal Area -->
<rect height="280" width="130" x="620" y="160"></rect>
<rect height="150" width="45" x="705" y="225"></rect>
<path d="M 620 255 A 75 75 0 0 0 620 345"></path>
<!-- Corner Arcs -->
<path d="M 50 65 A 15 15 0 0 0 65 50"></path>
<path d="M 735 50 A 15 15 0 0 0 750 65"></path>
<path d="M 50 535 A 15 15 0 0 1 65 550"></path>
<path d="M 750 535 A 15 15 0 0 0 735 550"></path>
</svg>
</div>
<!-- Top: Brand Logo -->
<div class="relative z-10 flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-primary-container text-on-primary-container flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-2xl" data-icon="sports_soccer">sports_soccer</span>
</div>
<span class="font-display text-2xl font-bold tracking-tight text-white">ArenaFlow</span>
</div>
<!-- Centered Content: Heading & Concise Description -->
<div class="relative z-10 my-auto max-w-xl">
<h1 class="font-headline text-3xl sm:text-4xl lg:text-5xl font-extrabold leading-tight tracking-tight text-white mb-6">
          Tạo kèo, ghép đội, đá bóng dễ dàng.
        </h1>
<p class="font-body text-base sm:text-lg text-emerald-100/90 leading-relaxed font-normal">
          Tìm đối thủ ngang trình độ, tuyển thêm người chơi và xây dựng uy tín cho đội của bạn.
        </p>
</div>
<!-- Left Column Anchor Placeholder (Self-balanced layout with absolutely nothing else) -->
<div class="relative z-10 h-6"></div>
</div>
<!-- Right Column: Pure Clean White Background with Centered Auth Card -->
<div class="w-full md:w-1/2 bg-surface-container-lowest flex items-center justify-center p-6 sm:p-12 lg:p-16 h-full">
<div class="w-full max-w-md mx-auto">
<!-- Auth Header -->
<div class="mb-8 text-center sm:text-left">
<h2 class="font-headline text-2xl sm:text-3xl font-bold text-on-surface tracking-tight mb-2">
            Đăng nhập hoặc đăng ký
          </h2>
<p class="font-body text-sm text-on-surface-variant">
            Tài khoản mới sẽ được tạo tự động ở lần đăng nhập đầu tiên
          </p>
</div>
<!-- Error Alert Banner -->
<div class="mb-6 p-4 rounded-xl bg-error-container/20 border border-error-container/40 flex items-start gap-3">
<span class="material-symbols-outlined text-error text-xl shrink-0 mt-0.5" data-icon="warning">warning</span>
<p class="text-sm font-medium text-error leading-snug">
            Đăng ký thất bại, vui lòng thử lại
          </p>
</div>
<!-- 3 Full-Width Stacked Action Buttons -->
<div class="flex flex-col gap-3.5">
<!-- Button 1: Google (Loading state with spinner, disabled) -->
<button class="relative w-full h-12 px-5 flex items-center justify-center rounded-xl bg-surface-container-low text-outline border border-outline-variant/40 cursor-not-allowed select-none opacity-80" disabled="" type="button">
<!-- Google "G" Icon -->
<svg class="w-5 h-5 shrink-0 absolute left-4 opacity-50" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

</svg>

<svg class="animate-spin h-4 w-4 text-outline" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<span class="font-headline font-semibold text-sm">Tiếp tục với Google</span>

</button>
<!-- Button 2: Facebook (Disabled) -->
